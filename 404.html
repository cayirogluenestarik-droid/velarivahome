<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı — Velariva Home</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --green-deep: #2D4A2E;
  --green-mid: #3B5E3C;
  --cream: #E8D5B5;
  --cream-pale: #FAF6EF;
  --gold: #C9A96E;
  --gold-light: #D4BC8E;
  --white: #FFFFFF;
  --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Jost', sans-serif;
  background: var(--green-deep);
  color: var(--cream);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  overflow: hidden;
  position: relative;
}
body::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(74,122,76,0.25) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 30%, rgba(201,169,110,0.08) 0%, transparent 50%);
  pointer-events: none;
}
body::after {
  content: '';
  position: absolute; inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
}
.container {
  position: relative;
  z-index: 1;
  padding: 40px 24px;
  max-width: 560px;
  animation: fadeUp 1s ease forwards;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  letter-spacing: 5px;
  color: var(--cream);
  text-decoration: none;
  display: block;
  margin-bottom: 60px;
}
.logo span {
  display: block;
  font-family: 'Jost', sans-serif;
  font-size: 9px;
  letter-spacing: 6px;
  color: var(--gold);
  font-weight: 400;
  margin-top: 3px;
  text-transform: uppercase;
}
.code {
  font-family: 'Playfair Display', serif;
  font-size: clamp(90px, 20vw, 140px);
  font-weight: 400;
  color: rgba(201,169,110,0.15);
  line-height: 1;
  letter-spacing: -4px;
  margin-bottom: -10px;
  user-select: none;
}
.divider {
  width: 48px;
  height: 1px;
  background: var(--gold);
  margin: 28px auto;
  opacity: 0.5;
}
.title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 400;
  color: var(--cream);
  margin-bottom: 16px;
  line-height: 1.3;
}
.desc {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 300;
  font-style: italic;
  color: rgba(232,213,181,0.55);
  margin-bottom: 48px;
  line-height: 1.7;
}
.btn {
  display: inline-block;
  padding: 16px 52px;
  border: 1px solid var(--gold);
  color: var(--cream);
  font-family: 'Jost', sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-decoration: none;
  transition: var(--transition);
}
.btn:hover {
  background: var(--gold);
  color: var(--green-deep);
}
</style>
</head>
<body>
  <div class="container">
    <a href="/" class="logo">
      VELARIVA
      <span>HOME</span>
    </a>
    <div class="code">404</div>
    <div class="divider"></div>
    <h1 class="title">Sayfa Bulunamadı</h1>
    <p class="desc">Aradığınız sayfa taşınmış ya da kaldırılmış olabilir.<br>Koleksiyonumuzu keşfetmeye devam edebilirsiniz.</p>
    <a href="/" class="btn">Ana Sayfaya Dön</a>
  </div>
</body>
</html>
